function calendarPage(){let days=[['LUN',12],['MAR',13],['MIÉ',14],['JUE',15],['VIE',16],['SÁB',17],['DOM',18]];return head('PLANIFICACIÓN','Calendario familiar','Una vista clara de las actividades, pagos y compromisos compartidos.')+`<div class="toolbar"><div><h3 class="sectiontitle">Octubre 2026</h3><p class="sectionhint">Semana del 12 al 18 de octubre</p></div><button class="softbtn" onclick="toast('Vista semanal de demostración')">Esta semana</button></div><div class="calendarstrip">${days.map(([w,d])=>`<button class="daycell ${day===d?'selected':''}" onclick="selectDay(${d})"><b>${w}</b><span>${d}</span></button>`).join('')}</div><div class="panel" style="margin-top:20px"><div class="panelhead"><h3>Agenda del ${day} de octubre</h3><span class="chip ch-jade">${day===14?'4 eventos':'2 eventos'}</span></div><div class="timeline">${(day===14?[['07:00','Sacar al perro','Cheyer · Rutina diaria',''],['12:30','Preparar almuerzo','Cristina · Rutina diaria','amber'],['17:00','Comprar alimentos','Jenapierre · Compra semanal','lav'],['19:00','Ordenar la cocina','Mamá · Rutina diaria','']]:[['08:00','Sacar al perro','Turno rotativo · Rutina diaria',''],['18:00','Organizar el hogar','Actividad familiar','lav']]).map(([hour,title,desc,cls])=>`<div class="slot"><div class="slot-time">${hour}</div><div class="slot-card ${cls}"><b>${title}</b><p>${desc}</p></div></div>`).join('')}</div></div>`}

function navigate(to){screen=to;document.querySelector('#screen').innerHTML=({inicio:home,tareas:tasksPage,calendario:calendarPage,finanzas:finance,metas:goals,familia:familyPage,marca:brandPage}[to])();shell();window.scrollTo(0,0)}window.navigate=navigate;function toggleTask(id){let t=tasks.find(t=>t.id===id);t.done=!t.done;toast(t.done?'Actividad marcada como completada (demostración)':'Actividad marcada como pendiente');navigate(screen)}window.toggleTask=toggleTask;function setFilter(v){filter=v;navigate('tareas')}window.setFilter=setFilter;function selectDay(d){day=d;navigate('calendario')}window.selectDay=selectDay;

function saveTask(){let n=document.getElementById('taskname').value.trim();if(!n){toast('Escribe el nombre de la actividad');return}let owner=document.getElementById('taskowner').value,time=document.getElementById('tasktime').value;tasks.unshift({id:Date.now(),name:n,owner,time,date:'Hoy',category:'Personalizada',done:false,type:'tasks'});closeModal();navigate('tareas');toast('Actividad añadida a la demostración')}window.saveTask=saveTask;
function saveBill(){let n=document.getElementById('billname').value.trim(),a=Number(document.getElementById('billamount').value);if(!n||!a||a<=0){toast('Completa servicio e importe');return}bills.push({name:n,date:'Por definir',amount:a,type:'receipt',paid:true});closeModal();navigate('finanzas');toast('Pago registrado en la demostración')}window.saveBill=saveBill;

function head(k,h,s='',button=''){return `<div class="kicker">${ic('spark',15)} ${k}</div><div class="page-head"><div><h1 class="headline">${h}</h1>${s?`<p class="sub">${s}</p>`:''}</div>${button}</div>`}
function taskItem(t,large=false){let photo=taskPhotos[t.id],status=t.done?'Hecha':'Hacer';return `<div class="${large?'simple-task big':'simple-task'}"><div class="taskavatar">${ic(t.type||'tasks',22)}</div><div class="simple-detail"><b>${ap(t.name)}</b><small>${ap(t.owner)} <span class="tiny-dot">·</span> ${ap(t.time||'Sin hora')}</small>${large?`<span class="taskfrequency">${ap(t.category||'Única')} · ${ap(t.date||'Hoy')}</span>`:''}</div>${photo?`<button class="photo-proof" aria-label="Ver foto de ${ap(t.name)}" onclick="viewPhoto(${t.id})"><img alt="Foto de evidencia" src="${photo}"></button>`:''}<button class="${t.done?'taskdone':'taskaction'}" onclick="toggleTask(${t.id})">${t.done?ic('check',18):ic('camera',18)} <span>${status}</span></button></div>`}
function home(){let today=tasks.filter(t=>t.date==='Hoy');let pending=today.filter(t=>!t.done).length;let paidPending=bills.filter(b=>!b.paid);let progress=Math.round(tasks.filter(t=>t.done).length/Math.max(tasks.length,1)*100);return head('MIÉRCOLES 14 DE OCTUBRE','Hola, familia 👋','Aquí está lo importante de hoy.')+`<section class="new-hero"><div><span class="hero-mini">HOY EN CASA</span><h2>${pending} ${pending===1?'tarea pendiente':'tareas pendientes'}</h2><p>¡Vamos en equipo!</p><button class="hero-cta" onclick="navigate('tareas')">Ver mis tareas ${ic('arrow',17)}</button></div><div class="hero-progress"><div class="hero-circle" style="--pct:${progress}%"><strong>${progress}%</strong><small>Hecho</small></div></div></section><div class="quick-grid"><button class="quick-action" onclick="showModal('task')"><span class="quick-icon lightgreen">${ic('plus',24)}</span><b>Nueva tarea</b>${ic('arrow',17)}</button><button class="quick-action" onclick="showModal('payment')"><span class="quick-icon lightamber">${ic('receipt',23)}</span><b>Nuevo pago</b>${ic('arrow',17)}</button></div><div class="columns simple-columns"><section class="panel simple-panel"><div class="panelhead"><h3>Tareas de hoy</h3><button class="textlink" onclick="navigate('tareas')">Ver todas ${ic('arrow',15)}</button></div>${today.slice(0,4).map(t=>taskItem(t)).join('')}</section><section class="panel simple-panel"><div class="panelhead"><h3>Por pagar</h3><button class="textlink" onclick="navigate('finanzas')">Ver pagos ${ic('arrow',15)}</button></div>${paidPending.slice(0,3).map(b=>`<div class="payrow"><div class="payicon">${ic(b.type)}</div><div class="paytext"><b>${ap(b.name)}</b><small>${ap(b.date)}</small></div><div class="paymoney"><b>${money(b.amount)}</b></div></div>`).join('')}<button class="mini-goal" onclick="navigate('metas')"><span class="quick-icon lightpurple">${ic('target',20)}</span><span><strong>Ahorro fin de año</strong><small>${Math.round(goalAmounts[0]/goalItems[0].target*100)}% ahorrado</small></span>${ic('arrow',18)}</button></section></div>`}
function tasksPage(){const filtered=tasks.filter(t=>(filter==='pendientes'?!t.done:filter==='completadas'?t.done:filter==='mias'?t.owner==='Yo':true)&&(ownerFilter==='todas'||t.owner===ownerFilter));return head('MIS RESPONSABILIDADES','Tareas','Cocinar, limpiar, pasear y más.',`<button class="primary add-main" onclick="showModal('task')">${ic('plus',20)} Crear</button>`)+`<div class="toolbar"><div class="filters">${[['todas','Todas'],['pendientes','Pendientes'],['completadas','Hechas'],['mias','Mías']].map(x=>`<button class="filter ${filter===x[0]?'selected':''}" onclick="setFilter('${x[0]}')">${x[1]}</button>`).join('')}</div></div><section class="panel simple-panel task-panel">${filtered.map(t=>taskItem(t,true)).join('')||`<div class="empty-state">${ic('check',28)}<b>¡Todo al día!</b><small>No hay tareas aquí.</small></div>`}</section><div class="help-strip">${ic('camera',19)} <span>Toca <b>Hacer</b> y añade una foto.</span></div>`}
function calendarPage(){let days=[['Lun',12],['Mar',13],['Mié',14],['Jue',15],['Vie',16],['Sáb',17],['Dom',18]];let agenda=day===14?tasks.filter(t=>t.date==='Hoy'):[{name:'Sacar al perro',owner:'Rotativo',time:'8:00 a. m.',type:'dog'},{name:'Limpieza del hogar',owner:'Todos',time:'6:00 p. m.',type:'tasks'}];return head('ORGANIZA TU SEMANA','Calendario','Todo en un solo lugar.')+`<div class="calendar-title"><h3>Octubre 2026</h3><span>12–18 oct</span></div><div class="calendarstrip easy-calendar">${days.map(([w,d])=>`<button class="daycell ${day===d?'selected':''}" onclick="selectDay(${d})"><b>${w}</b><span>${d}</span></button>`).join('')}</div><section class="panel simple-panel" style="margin-top:18px"><div class="panelhead"><h3>${day===14?'Hoy':day+' de octubre'}</h3><span class="chip ch-jade">${agenda.length} tareas</span></div>${agenda.map(t=>`<div class="agenda-row"><span class="agenda-time">${ap(t.time)}</span><span class="agenda-line"></span><span class="agenda-copy"><b>${ap(t.name)}</b><small>${ap(t.owner)}</small></span></div>`).join('')}</section><button class="wide-action" onclick="showModal('task')">${ic('plus',18)} Añadir actividad</button>`}
function finance(){let pending=bills.filter(b=>!b.paid).reduce((a,b)=>a+b.amount,0);let spent=expenses.reduce((a,b)=>a+b.amount,0);return head('DINERO DEL HOGAR','Pagos y gastos','Todo claro, sin olvidos.',`<button class="primary add-main" onclick="showModal(finTab==='pagos'?'payment':'expense')">${ic('plus',20)} Añadir</button>`)+`<div class="finance-summary"><div class="financial-tile green"><small>Por pagar</small><strong>${money(pending)}</strong><span>${bills.filter(b=>!b.paid).length} servicios</span></div><div class="financial-tile cream"><small>Compras</small><strong>${money(spent)}</strong><span>Este mes · ejemplo</span></div></div><div class="seg-control"><button class="${finTab==='pagos'?'selected':''}" onclick="setFinTab('pagos')">${ic('receipt',18)} Pagos</button><button class="${finTab==='gastos'?'selected':''}" onclick="setFinTab('gastos')">${ic('shopping',18)} Gastos</button></div><section class="panel simple-panel"><div class="panelhead"><h3>${finTab==='pagos'?'Servicios':'Compras del hogar'}</h3></div>${finTab==='pagos'?bills.map((b,i)=>`<div class="simple-money"><span class="payicon">${ic(b.type)}</span><span class="money-info"><b>${ap(b.name)}</b><small>${b.paid?'Pagado':'Vence '+ap(b.date)}</small></span><span class="money-right"><b>${money(b.amount)}</b>${b.paid?(billPhotos[i]?`<button class="small-photo" onclick="viewBillPhoto(${i})">${ic('camera',15)} Recibo</button>`:`<span class="status-good">${ic('check',14)} Listo</span>`):`<button class="small-pay" onclick="payBill(${i})">Pagar</button>`}</span></div>`).join(''):expenses.map(e=>`<div class="simple-money"><span class="payicon">${ic(e.type||'shopping')}</span><span class="money-info"><b>${ap(e.name)}</b><small>${ap(e.who)} · ${ap(e.date)}</small></span><span class="money-right"><b>${money(e.amount)}</b></span></div>`).join('')}</section>`}
function goals(){let pct=(a,b)=>Math.min(100,Math.round(a*100/b));return head('LO QUE QUEREMOS LOGRAR','Nuestros ahorros','Metas de mes o de año.',`<button class="primary add-main" onclick="showModal('newGoal')">${ic('plus',20)} Crear</button>`)+`<section class="goal-big"><div class="goal-label">${ic('pig',20)} META FAMILIAR</div><h2>${ap(goalItems[0].title)}</h2><div class="goal-total">${money(goalAmounts[0])} <small>de ${money(goalItems[0].target)}</small></div><div class="progress new-progress"><i style="width:${pct(goalAmounts[0],goalItems[0].target)}%"></i></div><div class="goal-bottom"><span><b>${pct(goalAmounts[0],goalItems[0].target)}%</b> ahorrado</span><span>${ap(goalItems[0].until)}</span></div><button class="primary" onclick="showModal('goal',0)">${ic('plus',18)} Aportar</button></section><div class="goal-grid-simple">${goalItems.slice(1).map((g,j)=>{let i=j+1;return `<div class="mini-goal-card"><span class="goal-icon ${g.tint}">${ic(g.icon,23)}</span><b>${ap(g.title)}</b><strong>${money(goalAmounts[i])}</strong><small>de ${money(g.target)}</small><div class="progress"><i style="width:${pct(goalAmounts[i],g.target)}%"></i></div><button class="textlink" onclick="showModal('goal',${i})">${ic('plus',16)} Aportar</button></div>`}).join('')}</div>`}
function familyPage(){return head('NUESTRO EQUIPO','Mi familia','Cada persona cuenta.')+`<div class="familygrid easy-family">${family.map(f=>`<button class="familycard family-link" onclick="goMember('${f[0]}')"><div class="avatar ${f[2]}">${f[1]}</div><b>${f[0]}</b><small>${tasks.filter(t=>t.owner===f[0]&&t.done).length} hechas</small><span class="points">${ic('trophy',13)} ${f[4]} puntos</span></button>`).join('')}</div><div class="panel simple-panel" style="margin-top:20px"><div class="panelhead"><h3>Resumen familiar</h3></div><div class="family-summary">${ic('check',24)} <b>${tasks.filter(t=>t.done).length} tareas hechas</b><span>¡Buen trabajo!</span></div></div><button class="wide-action" onclick="toast('Invitar por QR estará disponible en la APK.')">${ic('users',20)} Invitar familiar</button>`}
function brandPage(){let c=[['Jade','#087F72'],['Menta','#DCF5EB'],['Marfil','#F9FBF8'],['Azul','#173242'],['Lavanda','#EEE9FF'],['Durazno','#FFE6D6']];return head('CASA CONECTADA','Nuestra identidad','Clara, cálida y fácil de usar.')+`<div class="brandshowcase"><div class="largebrand">${ic('homecheck',62)}</div><div><h2>Casa Conectada</h2><p>Todo en casa. Todo en orden.</p></div></div><div class="toolbar"><h3 class="sectiontitle">Colores de la familia</h3></div><div class="designgrid">${c.map(([n,v])=>`<div class="colorcard"><div class="swatch" style="background:${v}"></div><b>${n}</b><small>${v}</small></div>`).join('')}</div><div class="panel simple-panel" style="margin-top:18px"><h3>Simple y accesible</h3><div class="help-strip">${ic('check',18)} Letras claras · Botones grandes · Pocos pasos</div></div>`}
function toggleTask(id){let t=tasks.find(t=>t.id===id);if(!t)return;if(t.done){modal(`<h2>¿Marcar como pendiente?</h2><p>${ap(t.name)}</p><div class="modal-actions"><button class="softbtn" onclick="closeModal()">Volver</button><button class="primary" onclick="undoTask(${id})">Sí, cambiar</button></div>`);return}photoDraft='';pendingTarget={kind:'task',id};modal(`<h2>¡Buen trabajo! 🎉</h2><p>${ap(t.name)}</p><div class="photo-drop"><div class="photo-symbol">${ic('camera',32)}</div><b>Agrega una foto</b><small>Para que la familia vea que se hizo</small><input type="file" accept="image/*" capture="environment" aria-label="Seleccionar fotografía" onchange="loadPhoto(event)"><img id="photo-preview" alt="Vista previa de tu foto" hidden></div><div class="modal-actions"><button class="softbtn" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveEvidence()">${ic('check',17)} Terminar</button></div>`)}
function undoTask(id){let t=tasks.find(x=>x.id===id);if(t){t.done=false;delete taskPhotos[id];persist();}closeModal();navigate(screen);toast('Tarea pendiente')}
function loadPhoto(e){let file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Elige una imagen');return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let w=img.width,h=img.height,scale=Math.min(1,840/Math.max(w,h)),canvas=document.createElement('canvas');canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);photoDraft=canvas.toDataURL('image/jpeg',.68);let preview=document.getElementById('photo-preview');if(preview){preview.src=photoDraft;preview.hidden=false}};img.src=reader.result};reader.readAsDataURL(file)}
function saveEvidence(){if(!photoDraft){toast('Primero añade una foto');return}if(pendingTarget?.kind==='task'){let id=pendingTarget.id,t=tasks.find(x=>x.id===id);if(t){t.done=true;t.evidence=true;taskPhotos[id]=photoDraft}}if(pendingTarget?.kind==='bill'){let index=pendingTarget.id;if(bills[index]){bills[index].paid=true;billPhotos[index]=photoDraft}}persist();closeModal();navigate(screen);toast('¡Guardado con foto!')}
function viewPhoto(id){let t=tasks.find(x=>x.id===id),src=taskPhotos[id];if(src)modal(`<h2>Foto de la tarea</h2><p>${ap(t?.name||'Tarea')} · ${ap(t?.owner||'')}</p><img class="evidence-image" src="${src}" alt="Foto adjunta a la tarea"><div class="modal-actions"><button class="primary" onclick="closeModal()">Cerrar</button></div>`)}
function viewBillPhoto(i){let src=billPhotos[i];if(src)modal(`<h2>Comprobante</h2><p>${ap(bills[i].name)}</p><img class="evidence-image" src="${src}" alt="Comprobante registrado"><div class="modal-actions"><button class="primary" onclick="closeModal()">Cerrar</button></div>`)}
function payBill(i){pendingTarget={kind:'bill',id:i};photoDraft='';modal(`<h2>Marcar como pagado</h2><p>${ap(bills[i].name)} · ${money(bills[i].amount)}</p><div class="photo-drop"><div class="photo-symbol">${ic('camera',32)}</div><b>Foto del comprobante</b><small>Adjunta tu recibo de pago</small><input type="file" accept="image/*" capture="environment" aria-label="Seleccionar comprobante" onchange="loadPhoto(event)"><img id="photo-preview" alt="Vista previa del comprobante" hidden></div><div class="modal-actions"><button class="softbtn" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveEvidence()">Guardar pago</button></div>`)}
function showModal(kind,idx=0){if(kind==='task'){modal(`<h2>Nueva tarea</h2><p>¿Qué hay que hacer?</p><label class="field">Actividad<input id="taskname" placeholder="Ej. Sacar al perro" maxlength="70" autofocus></label><label class="field">¿Quién la hará?<select id="taskowner">${['Yo','Cheyer','Cristina','Jenapierre','Mamá','Todos'].map(n=>`<option>${n}</option>`).join('')}</select></label><div class="modal-two"><label class="field">Hora<input id="tasktime" type="time" value="17:00"></label><label class="field">Se repite<select id="taskrepeat"><option>Única</option><option>Diaria</option><option>Semanal</option><option>Mensual</option><option>Rotativa</option></select></label></div><div class="modal-actions"><button class="softbtn" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveTask()">Guardar tarea</button></div>`);return}
if(kind==='payment'){modal(`<h2>Nuevo pago</h2><p>Agrega un servicio o cuenta.</p><label class="field">Servicio<input id="billname" placeholder="Ej. Agua" maxlength="70"></label><div class="modal-two"><label class="field">Monto (S/)<input id="billamount" type="number" min="1" step="0.01" placeholder="0.00"></label><label class="field">Vence<input id="billdate" type="date" value="2026-10-24"></label></div><div class="modal-actions"><button class="softbtn" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveBill()">Guardar pago</button></div>`);return}
if(kind==='expense'){modal(`<h2>Nuevo gasto</h2><p>¿Qué compraron?</p><label class="field">Compra<input id="expname" placeholder="Ej. Mercado" maxlength="70"></label><label class="field">Monto (S/)<input id="expamount" type="number" min="1" step="0.01" placeholder="0.00"></label><div class="modal-actions"><button class="softbtn" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveExpense()">Guardar gasto</button></div>`);return}
if(kind==='goal'){modal(`<h2>Agregar ahorro</h2><p>Un poquito más cerca de la meta.</p><label class="field">Meta<select id="goalindex">${goalItems.map((g,i)=>`<option value="${i}" ${i===idx?'selected':''}>${ap(g.title)}</option>`).join('')}</select></label><label class="field">Aporte (S/)<input id="goalamount" type="number" min="1" step="0.01" placeholder="100.00"></label><div class="modal-actions"><button class="softbtn" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveGoal()">Ahorrar</button></div>`);return}
if(kind==='newGoal'){modal(`<h2>Nueva meta</h2><p>¿Para qué quieren ahorrar?</p><label class="field">Nombre<input id="newgoalname" placeholder="Ej. Navidad" maxlength="65"></label><label class="field">Meta en soles<input id="newgoaltarget" type="number" min="1" step="0.01" placeholder="1000.00"></label><label class="field">Fecha objetivo<input id="newgoaldate" type="date" value="2026-12-31"></label><div class="modal-actions"><button class="softbtn" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveNewGoal()">Crear meta</button></div>`)} }
function saveTask(){let n=document.getElementById('taskname').value.trim();if(!n){toast('Escribe una tarea');return}let own=document.getElementById('taskowner').value,tim=document.getElementById('tasktime').value,rep=document.getElementById('taskrepeat').value;tasks.unshift({id:Date.now(),name:n,owner:own,time:tim,date:'Hoy',category:rep,done:false,type:'tasks'});persist();closeModal();navigate('tareas');toast('Tarea creada')}
function saveBill(){let n=document.getElementById('billname').value.trim(),a=Number(document.getElementById('billamount').value),date=document.getElementById('billdate').value;if(!n||!a||a<=0){toast('Completa el servicio y monto');return}bills.push({name:n,date:date?date.slice(8)+'/'+date.slice(5,7):'Sin fecha',amount:a,type:'receipt',paid:false});persist();closeModal();finTab='pagos';navigate('finanzas');toast('Pago agregado')}
function saveExpense(){let n=document.getElementById('expname').value.trim(),a=Number(document.getElementById('expamount').value);if(!n||!a||a<=0){toast('Completa el gasto y monto');return}expenses.unshift({name:n,amount:a,who:'Yo',date:'Hoy',type:'shopping'});persist();closeModal();finTab='gastos';navigate('finanzas');toast('Gasto agregado')}
function saveGoal(){let i=Number(document.getElementById('goalindex').value),a=Number(document.getElementById('goalamount').value);if(!a||a<=0){toast('Escribe un monto válido');return}goalAmounts[i]+=a;persist();closeModal();navigate('metas');toast('¡Ahorro registrado!')}
function saveNewGoal(){let n=document.getElementById('newgoalname').value.trim(),v=Number(document.getElementById('newgoaltarget').value),dt=document.getElementById('newgoaldate').value;if(!n||!v||v<=0){toast('Completa el nombre y monto');return}goalItems.push({title:n,target:v,until:dt?dt.split('-').reverse().join('/'):'Sin fecha',icon:'target',tint:'purple'});goalAmounts.push(0);persist();closeModal();navigate('metas');toast('Nueva meta creada')}
function setFinTab(t){finTab=t;navigate('finanzas')}
function goMember(owner){ownerFilter=owner;filter='todas';navigate('tareas')}
function setFilter(f){filter=f;ownerFilter='todas';navigate('tareas')}
function closeModal(){document.querySelector('#modalroot').innerHTML='';pendingTarget=null;photoDraft=''}
function openNotifications(){modal(`<h2>Recordatorios</h2><div class="moneyitem"><div class="payicon">${ic('zap')}</div><div><b>Pagar luz</b><small>24 de octubre</small></div></div><div class="moneyitem"><div class="payicon">${ic('utensils')}</div><div><b>Preparar almuerzo</b><small>Hoy · 12:30</small></div></div><div class="modal-actions"><button class="primary" onclick="closeModal()">Listo</button></div>`)}
Object.assign(window,{shell,toggleTask,undoTask,saveEvidence,loadPhoto,viewPhoto,viewBillPhoto,payBill,showModal,saveTask,saveBill,saveGoal,saveExpense,saveNewGoal,setFinTab,goMember,setFilter,closeModal,openNotifications});

navigate('inicio');
</script></body></html>
